name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, memory]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: taskmanager_ci_only
          POSTGRES_DB: taskmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      # Isolated, throwaway CI database. The memory run uses pg-mem instead.
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://taskmanager:taskmanager_ci_only@localhost:5432/taskmanager_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage
        if: matrix.database == 'postgres'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov-report

  flutter:
    name: Flutter analyze + unit/widget tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: mobile/coverage/lcov.info

  android-build:
    name: Android debug build (compatibility smoke)
    runs-on: ubuntu-latest
    needs: flutter
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Platform folders are generated, not committed (see mobile/README.md).
      - run: flutter create --platforms=android --org mx.edu.utng --project-name task_manager .
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: task-manager-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  web-build:
    name: Web build (used for evidence screenshots)
    runs-on: ubuntu-latest
    needs: flutter
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web --org mx.edu.utng --project-name task_manager .
      - run: flutter build web --release --dart-define=API_BASE_URL=http://localhost:3000
      - uses: actions/upload-artifact@v4
        with:
          name: task-manager-web
          path: mobile/build/web

  k6-smoke:
    name: k6 performance smoke (CI-local API only)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: taskmanager_ci_only
          POSTGRES_DB: taskmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://taskmanager:taskmanager_ci_only@localhost:5432/taskmanager
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else
      AUTH_RATE_LIMIT_MAX: '100'
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Start API
        working-directory: backend
        run: |
          node src/server.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 1; done
      - uses: grafana/setup-k6-action@v1
      - name: Health check load (5 VUs, 30s)
        run: k6 run --summary-export=k6-health.json backend/perf/health-test.js
      - name: Authenticated task list load
        run: k6 run --summary-export=k6-tasks.json backend/perf/tasks-list-test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: k6-*.json
